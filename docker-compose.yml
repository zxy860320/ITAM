# ITYW 一键部署：mysql + ityw-server(:8787) + topology-svc(:8790, MySQL 引擎) + web(nginx :80)
# 使用前：cp .env.example .env 并修改密码；准备 server/data/source.json（Zabbix 凭据，见 docs/DEPLOY-DOCKER.md）
name: ityw

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ityw_topology}
      MYSQL_USER: ${MYSQL_USER:-topology}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    # 数据库仅供容器内访问，不映射宿主机端口；调试需要时取消注释：
    # ports:
    #   - "127.0.0.1:3306:3306"

  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    environment:
      PORT: "8787"
      # /mcp 可选 Bearer 鉴权（内网默认免鉴权）；前端内嵌页拼装 iframe 地址用 AI_PORT
      ITYW_MCP_TOKEN: ${ITYW_MCP_TOKEN:-}
      AI_ASSISTANT_PORT: ${AI_PORT:-3001}
      AI_ASSISTANT_URL: ${AI_ASSISTANT_URL:-}
    volumes:
      # source.json / notify.json / notify_state.json / dbmp_samples.json / ai_audit.jsonl 持久化
      - ./server/data:/app/server/data
    # 仅 web(nginx) 经内部网络访问；调试需要时取消注释：
    # ports:
    #   - "127.0.0.1:8787:8787"

  topology:
    build:
      context: .
      dockerfile: deploy/Dockerfile.topology
    image: ityw-topology:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TOPO_PORT: "8790"
      TOPO_DB: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-topology}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ityw_topology}
      ZBX_SOURCE_CFG: /app/config/source.json
    volumes:
      # 只读复用 P0 的 Zabbix 凭据文件（topology-svc 从不写它）
      - ./server/data/source.json:/app/config/source.json:ro
    # ports:
    #   - "127.0.0.1:8790:8790"

  # AI 助手前端（Open WebUI）：平台内嵌页 iframe 指向它；MCP 工具层 = server:8787/mcp
  # 首次部署后管理员配置一次：
  #   1) Settings > Admin > Integrations > External Tool Servers > Add Connection
  #      Type=MCP (Streamable HTTP), URL=http://server:8787/mcp, Auth=None
  #   2) Settings > Admin > Connections 配 OpenAI 兼容模型端点（内网 vLLM/Ollama 均可）
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.5
    restart: unless-stopped
    depends_on:
      - server
    environment:
      WEBUI_NAME: ${AI_WEBUI_NAME:-ITYW AI 运维助手}
      # 加密会话/OAuth token 的密钥——固定后重建容器不掉登录态
      WEBUI_SECRET_KEY: ${AI_SECRET_KEY:?AI_SECRET_KEY 未设置（.env 加一行随机串）}
      ENABLE_SIGNUP: ${AI_ENABLE_SIGNUP:-false}
      ENABLE_OLLAMA_API: ${AI_OLLAMA:-false}
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      WEBUI_URL: ${AI_PUBLIC_URL:-}
      DATA_DIR: /app/backend/data
    volumes:
      - open_webui_data:/app/backend/data
    # 仅 nginx(3001 server 块) 经内部网络访问，不直接映射宿主机端口：
    # ports:
    #   - "127.0.0.1:3002:8080"

  # AI agent（LangGraph）：自研聊天后端的"大脑"，工具复用 server 的 /mcp（零改动）
  # 模型走任意 OpenAI 兼容端点：内网 LiteLLM/Ollama/vLLM 均可（见 .env.example 注释；
  # 容器内天然无宿主 HTTP_PROXY 污染，宿主机直接裸跑 agent 时需剥离代理 env）
  agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
    restart: unless-stopped
    depends_on:
      - server
    environment:
      ITYW_MCP_URL: http://server:8787/mcp
      ITYW_MCP_TOKEN: ${ITYW_MCP_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - ./agent/data:/app/data   # LangGraph checkpoint（会话记忆），SQLite 单文件
    # ports:
    #   - "127.0.0.1:8791:8791"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - server
      - topology
    ports:
      - "${WEB_PORT:-80}:80"
      # AI 助手（nginx → open-webui，剥离 X-Frame-Options 供平台 iframe 内嵌）
      - "${AI_PORT:-3001}:3001"

  # 一次性数据迁移（sqlite → MySQL）：
  #   先 docker compose build topology，再
  #   docker compose --profile tools run --rm migrate
  # 迁移源 = ./topology/data/topology.db（只读挂载），凭据走 .env 的 MYSQL_*
  migrate:
    image: ityw-topology:latest
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    command: ["node", "topology/scripts/migrate-sqlite-to-mysql.mjs"]
    environment:
      TOPO_SQLITE: /data/topology.db
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-topology}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ityw_topology}
    volumes:
      - ./topology/data/topology.db:/data/topology.db:ro

volumes:
  mysql_data:
  open_webui_data:
