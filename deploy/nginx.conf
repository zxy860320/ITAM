# 与 web/vite.config.ts 的代理规则等价：
#   /api       → ityw-server:8787   （原样转发，P0 路由本身就以 /api 开头）
#   /topo-api/ → topology-svc:8790  （去前缀改写为 /api/，与 vite rewrite 一致）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端为 SPA（hash 路由），静态资源直接回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # P0 监控 API
    location /api {
        proxy_pass http://server:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # AI agent（LangGraph）：SSE 流式必须关缓冲，否则聊天不流式
    location /api/agent/ {
        proxy_pass http://server:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # MCP 工具端点（供平台外的 Open WebUI 等客户端接入：http://<平台host>/mcp）
    # 平台自带 nginx 转发，避免直接暴露 8787；鉴权走可选的 ITYW_MCP_TOKEN（Bearer）
    location /mcp {
        proxy_pass http://server:8787/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # P1 拓扑 API（/topo-api/xxx → topology:8790/api/xxx）
    location /topo-api/ {
        proxy_pass http://topology:8790/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # discovery/pathtrace 刷新可能较慢
        proxy_read_timeout 300s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}

# AI 助手（Open WebUI）：平台前端 iframe 内嵌 http://<host>:3001
# 关键点：剥离上游 X-Frame-Options/CSP frame-ancestors，否则 iframe 白屏；
# WebSocket(/ws) 必须升级转发，否则聊天不流式/断连。
#
# ── ITYW 账号 SSO（受信头）────────────────────────────────────────────
# 每个进入 :3001 的请求先经 auth_request 子请求向 P0 验证 uocp_sess 会话
# （auth_request 会转发原始 Cookie；同 host 不同端口属 same-site，iframe 天然带上）：
#   会话有效 → P0 /api/auth/probe 回 200 + X-ITYW-Email/Name/Role 响应头，
#              这里取到后【无条件覆盖】注入主请求转发给 open-webui
#              （proxy_set_header 会先丢弃客户端自带的同名头——防伪造），
#              OWUI 按 WEBUI_AUTH_TRUSTED_EMAIL_HEADER 自动建档/登录；
#   无会话   → 401，请求不触达 open-webui。
# 安全前提：open-webui 容器不映射宿主端口（见 docker-compose.yml），
# 全网只有本 nginx 能触达它——受信头模型的成立条件，不可放开。
server {
    listen 3001;
    server_name _;

    # 会话验证子请求（internal：外部无法直接访问该路径）
    location = /_ityw-auth {
        internal;
        proxy_pass http://server:8787/api/auth/probe;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # 未登录直开 :3001 时给个可读提示（引导走平台登录）
    error_page 401 = @need_login;
    location @need_login {
        default_type 'text/plain; charset=utf-8';
        return 401 '未登录 ITYW 平台。请先登录平台（http://<host>/），再打开 AI 助手页。';
    }

    location / {
        auth_request /_ityw-auth;
        auth_request_set $ityw_email $upstream_http_x_ityw_email;
        auth_request_set $ityw_name $upstream_http_x_ityw_name;
        auth_request_set $ityw_role $upstream_http_x_ityw_role;
        proxy_pass http://open-webui:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 受信身份头（变量为空时 proxy_set_header 不发该头 → OWUI 走自身登录页兜底）
        proxy_set_header X-ITYW-Email $ityw_email;
        proxy_set_header X-ITYW-Name $ityw_name;
        proxy_set_header X-ITYW-Role $ityw_role;
        proxy_read_timeout 600s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }
}
