# 与 web/vite.config.ts 的代理规则等价：
#   /api       → ityw-server:8787   （原样转发，P0 路由本身就以 /api 开头）
#   /topo-api/ → topology-svc:8790  （去前缀改写为 /api/，与 vite rewrite 一致）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端为 SPA（hash 路由），静态资源直接回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # P0 监控 API
    location /api {
        proxy_pass http://server:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # P1 拓扑 API（/topo-api/xxx → topology:8790/api/xxx）
    location /topo-api/ {
        proxy_pass http://topology:8790/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # discovery/pathtrace 刷新可能较慢
        proxy_read_timeout 300s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
